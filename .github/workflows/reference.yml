name: Reference parity

# scikit-learn / PyTorch parity tests (pytest -m reference). Kept out of the
# main CI: they pull heavy dependencies and only need to run deliberately, not
# on every push. Manual trigger only — see plan.md section 5.
on:
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra reference

      - name: Reference parity tests
        run: uv run pytest -m reference -q
