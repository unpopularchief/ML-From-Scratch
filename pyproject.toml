[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scratchgrad"
version = "0.0.1"
description = "Machine learning and deep learning algorithms implemented from first principles in Python and NumPy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Niyaf Mukhthaar" }]
keywords = ["machine-learning", "deep-learning", "numpy", "from-scratch", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

# Runtime dependency: NumPy, and nothing else. See plan.md section 6.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "pre-commit"]
# scikit-learn parity tests only, added at M1. PyTorch joins this extra at M3.
reference = ["scikit-learn"]
# plotting in examples/ only, never imported by the library itself.
examples = ["matplotlib"]

[project.urls]
Repository = "https://github.com/unpopularchief/ML-From-Scratch"

[tool.hatch.build.targets.wheel]
packages = ["src/scratchgrad"]

[tool.pytest.ini_options]
addopts = "-m 'not reference'"
markers = [
    "reference: compares output against scikit-learn/PyTorch; opt-in, run with -m reference",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "D"]
# D203/D213 conflict with D211/D212 (blank-line-before-class-docstring style); NumPy-style
# docstrings use D212's convention (summary starts on the line after the opening quotes).
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests document intent through their names, not docstrings
